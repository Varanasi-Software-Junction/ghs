name: Build ExamForge Debug APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'twa/**'
      - '.github/workflows/build-debug-apk.yml'

permissions:
  contents: write

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and build tools
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Install Bubblewrap
        working-directory: twa
        run: npm install --no-audit --no-fund

      - name: Configure Bubblewrap
        working-directory: twa
        run: npx bubblewrap updateConfig --jdkPath="$JAVA_HOME" --androidSdkPath="$ANDROID_SDK_ROOT"

      - name: Generate Android TWA project
        shell: bash
        run: |
          rm -rf twa/android
          mkdir -p twa/android
          cd twa
          npx bubblewrap update --skipVersionUpgrade --manifest="$GITHUB_WORKSPACE/twa/twa-manifest.json" --directory="$GITHUB_WORKSPACE/twa/android"

      - name: Build debug APK
        working-directory: twa/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Collect APK and fingerprint
        shell: bash
        run: |
          APK="$(find twa/android -path '*/build/outputs/apk/debug/*.apk' | head -n 1)"
          test -n "$APK"
          mkdir -p downloads
          cp "$APK" downloads/ExamForge-debug.apk
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | sed -n 's/^[[:space:]]*SHA256: /SHA256=/p' > downloads/debug-fingerprint.txt
          printf 'Built from commit: %s\nBuilt at: %s\nPackage: live.learnwithchampak.exams\nOrigin: https://exams.learnwithchampak.live\n' "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > downloads/build-info.txt
          cat downloads/debug-fingerprint.txt
          ls -lh downloads/ExamForge-debug.apk

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ExamForge-debug-apk
          path: |
            downloads/ExamForge-debug.apk
            downloads/debug-fingerprint.txt
            downloads/build-info.txt
          if-no-files-found: error
          retention-days: 30

      - name: Commit downloadable APK
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add downloads/ExamForge-debug.apk downloads/debug-fingerprint.txt downloads/build-info.txt
          git commit -m 'Publish ExamForge debug APK [skip ci]' || exit 0
          git push
