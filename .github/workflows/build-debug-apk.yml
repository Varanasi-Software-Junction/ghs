name: Build ExamForge Debug APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'twa/**'
      - '.github/workflows/build-debug-apk.yml'

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and build tools
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Install Bubblewrap
        working-directory: twa
        run: npm install --no-audit --no-fund

      - name: Configure Bubblewrap
        working-directory: twa
        run: npx bubblewrap updateConfig --jdkPath="$JAVA_HOME" --androidSdkPath="$ANDROID_SDK_ROOT"

      - name: Generate Android TWA project
        shell: bash
        run: |
          rm -rf twa/android
          mkdir -p twa/android
          cd twa
          npx bubblewrap update --skipVersionUpgrade --manifest="$GITHUB_WORKSPACE/twa/twa-manifest.json" --directory="$GITHUB_WORKSPACE/twa/android"

      - name: Build debug APK
        working-directory: twa/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Collect APK and fingerprint
        shell: bash
        run: |
          APK="$(find twa/android -path '*/build/outputs/apk/debug/*.apk' | head -n 1)"
          test -n "$APK"
          cp "$APK" ExamForge-debug.apk
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | sed -n 's/^[[:space:]]*SHA256: /SHA256=/p' > debug-fingerprint.txt
          cat debug-fingerprint.txt
          ls -lh ExamForge-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ExamForge-debug-apk
          path: |
            ExamForge-debug.apk
            debug-fingerprint.txt
          if-no-files-found: error
          retention-days: 30
