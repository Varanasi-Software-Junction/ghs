<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0f3d75" />
  <meta name="description" content="ExamForge by Learn With Champak — old question papers, MCQ tests, practice, paper generation and saved test activity." />
  <title>ExamForge | Learn With Champak</title>
  <link rel="icon" href="examforge/icon.svg" type="image/svg+xml" />
  <meta http-equiv="refresh" content="0; url=examforge/" />
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#f5f8fc;color:#172033}
    main{width:min(560px,92vw);padding:34px;border:1px solid #d9e2ec;border-radius:22px;background:#fff;box-shadow:0 16px 40px rgba(15,61,117,.12);text-align:center}
    .mark{display:grid;place-items:center;width:58px;height:58px;margin:0 auto 16px;border-radius:16px;background:linear-gradient(135deg,#0f3d75,#1769aa);color:#fff;font-weight:800;font-size:1.25rem}
    h1{margin:.2em 0}.sub{color:#667085;line-height:1.6}
    a{display:inline-flex;margin-top:12px;padding:12px 18px;border-radius:11px;background:#0f3d75;color:#fff;text-decoration:none;font-weight:750}
  </style>
  <script>
    (function(){
      var target='examforge/' + (location.search || '') + (location.hash || '');
      location.replace(target);
    })();
  </script>
</head>
<body>
  <main>
    <div class="mark">EF</div>
    <h1>ExamForge</h1>
    <p class="sub">Opening the Learn With Champak question-paper laboratory…</p>
    <a href="examforge/">Open ExamForge</a>
  </main>
</body>
</html>
